<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos de Material — Astillero TASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#0f1b2d;--muted:#4b5a6b;--line:#d9e0e7;--navy:#154378;--navy2:#1d5597;--accent:#5f8c1a;--ok:#1f8a70;--warn:#c98a12;--bad:#c0392b;--info:#2d6cdf;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0ff;border-color:#6a9cf0}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
.top .brand{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top .brand i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
.top .sp{flex:1}
.top .who{font-size:12px;opacity:.9;text-align:right;line-height:1.3}
.top select{width:auto;background:var(--navy2);color:#fff;border-color:#2c4a77;padding:5px 8px;font-size:12px}
.layout{display:flex;min-height:calc(100vh - 50px)}
nav.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex-shrink:0}
nav.side button,nav.bottom button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--ink);text-align:left}
nav.side button:hover{background:#f1f4f8}
nav.side button.on{background:#e6edf8;color:var(--navy);font-weight:600}
nav svg{width:18px;height:18px;flex-shrink:0}
nav.bottom{display:none}
main{flex:1;padding:18px;max-width:1280px;min-width:0}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f5f7fa}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.p:hover{background:var(--navy2)}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--bad)}
.btn.s{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;border-left:4px solid var(--c,var(--navy))}
.kpi:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi span{font-size:13px;color:var(--ink);font-weight:500}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #eef1f4;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
td input,td select{padding:5px 7px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;background:#e4e9ef;color:#1f2f42;border:1px solid rgba(0,0,0,.08)}
.e-Borrador{background:#e4e8ee;color:#2b3a4c}.e-Enviada{background:#d6e4fc;color:#123c8f}.e-Observada{background:#fbdcd8;color:#7d1a10}.e-Validada{background:#d3efe4;color:#0b4d3a}.e-Exportada{background:#fde7bf;color:#6b4300}.e-Reservada{background:#e3d8fa;color:#3f1d8c}.e-Atendida{background:#c9ead7;color:#08452a}.e-Anulada{background:#e2e2e2;color:#4a4a4a}
.ref{background:#fde7bf;color:#6b4300}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:13px;line-height:1.4;border-bottom:1px dashed var(--line)}
.issues li:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.error{background:var(--bad)}.dot.aviso{background:var(--warn)}.dot.ok{background:var(--ok)}
.bars .b{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bars .t{background:#eef1f4;border-radius:4px;height:14px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--navy2);border-radius:4px}
.ov{position:fixed;inset:0;background:rgba(11,37,69,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.w{max-width:900px}
.modal h2{font-size:17px;margin-bottom:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.results{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;margin-top:6px;background:#fff}
.results div{padding:8px 10px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;gap:10px}
.results div:hover{background:#f3f7fd}
.warn{background:#fff3dc;border:1px solid #ecc77e;color:#5c3d00;border-radius:8px;padding:8px 11px;font-size:13px;margin-top:6px}
.bad{background:#fde6e3;border:1px solid #eea79d;color:#701a10;border-radius:8px;padding:8px 11px;font-size:13px}
.okbox{background:#def2e9;border:1px solid #96d1ba;color:#0b4532;border-radius:8px;padding:8px 11px;font-size:13px}
.result{font-size:28px;font-weight:700;color:var(--navy)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;font-size:14px;font-weight:500;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);border:0;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--navy);border-color:var(--accent)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.hist{font-size:12.5px;color:#2e3d4f;max-height:200px;overflow:auto}
.hist div{padding:3px 0}
.banner{background:#fff3dc;border-bottom:1px solid #ecc77e;color:#5c3d00;padding:8px 16px;font-size:13px}
.formula{font-family:'IBM Plex Mono',monospace;background:#e9edf3;color:#16263b;padding:2px 6px;border-radius:4px;font-size:12.5px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.center{max-width:460px;margin:60px auto;padding:0 12px}
.scroll{overflow-x:auto}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav.bottom button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:68px;align-items:center;text-align:center;color:var(--muted)}
  nav.bottom button.on{color:var(--navy);font-weight:600}
  main{padding:12px 12px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .who .nm,.top .brand .nm{display:none}.top{gap:8px;padding:8px 10px}.top .who{font-size:11px}
  table.rs thead{display:none}
  table.rs tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px;background:#fff}
  table.rs td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:4px 6px}
  table.rs td::before{content:attr(data-l);font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0}
  table.rs td input,table.rs td select{max-width:60%}
  .ov{padding:10px}
}

/* ---- Marca TASA ---- */
.lg{position:fixed;inset:0;overflow:auto;background:
  linear-gradient(rgba(103,191,237,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(103,191,237,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(rgba(103,191,237,.035) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(90deg,rgba(103,191,237,.035) 1px,transparent 1px) 0 0/8px 8px,
  radial-gradient(ellipse at 20% 10%,#1d5597 0%,#154378 45%,#0b2a52 100%);color:#fff}
.lg-art{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;max-height:48vh;pointer-events:none;opacity:.5}
.lg::after{content:'';position:fixed;left:0;right:0;bottom:0;height:48vh;background:linear-gradient(to bottom,rgba(11,42,82,0) 0%,rgba(11,42,82,.0) 55%,rgba(11,42,82,.35) 100%);pointer-events:none}
.lg-wrap{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;gap:72px;padding:10vh 24px 34vh;flex-wrap:wrap}
.lg-brand{max-width:440px;text-shadow:0 2px 14px rgba(5,25,55,.6)}
.lg-brand img{width:132px;height:132px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.12);display:block}
.lg-brand h1{font-size:34px;line-height:1.15;margin:26px 0 0;font-weight:700;letter-spacing:.2px}
.lg-brand h1 span{display:block;font-weight:400;font-size:22px;color:#cfe6f7;margin-top:4px}
.lg-brand .bar{width:64px;height:4px;background:#7CA22B;border-radius:2px;margin:18px 0 12px}
.lg-brand .sub{font-size:15px;letter-spacing:2.5px;text-transform:uppercase;color:#9fd3f2;font-weight:600}
.lg-card{background:#fff;color:var(--ink);border-radius:16px;padding:26px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(4,20,45,.45)}
.lg-card h2{font-size:18px;margin:0 0 4px}
.lg-card .btn.p{width:100%;justify-content:center;padding:11px;font-size:15px}
.lg-foot{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.55);z-index:1;letter-spacing:.5px}
@media (max-width:860px){.lg-wrap{flex-direction:column;gap:22px;padding:28px 16px 140px;justify-content:flex-start}
  .lg-brand{text-align:center}.lg-brand img{width:96px;height:96px;margin:0 auto;border-radius:18px}
  .lg-brand h1{font-size:24px;margin-top:16px}.lg-brand h1 span{font-size:17px}.lg-brand .bar{margin:12px auto 8px}.lg-brand .sub{font-size:12px}}
.top .logo{width:30px;height:30px;border-radius:6px;display:block}

.lg-cw{position:relative;width:100%;max-width:380px;margin-top:84px}
.lg-cw .lg-card{position:relative;z-index:1;padding-top:44px}
.rb-head{position:absolute;left:50%;top:-104px;width:132px;transform:translateX(-50%);z-index:0;animation:rbBob 4s ease-in-out infinite}
.rb-arm{position:absolute;top:-22px;height:80px;z-index:2;pointer-events:none;overflow:visible}
.rb-arm.l{left:-16px;width:calc(50% - 22px)}.rb-arm.r{right:-16px;width:calc(50% - 22px);transform:scaleX(-1)}
.rb-hand{position:absolute;top:44px;width:50px;height:50px;z-index:3;pointer-events:none}
.rb-hand.l{left:-34px}.rb-hand.r{right:-34px;transform:scaleX(-1)}
.rb-eye{animation:rbBlink 5s infinite;transform-origin:center;transform-box:fill-box}
.rb-ant{animation:rbGlow 2.4s ease-in-out infinite}
@keyframes rbBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rbGlow{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.rb-head,.rb-eye,.rb-ant{animation:none}}
@media (max-width:860px){.lg-cw{margin-top:100px;width:calc(100% - 36px)}}

/* ---- Asistente robot ---- */
body{background:linear-gradient(rgba(21,67,120,.035) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(21,67,120,.035) 1px,transparent 1px) 0 0/28px 28px,#eef2f6}
.top{background:linear-gradient(90deg,#123a69,#154378 40%,#1d5597)}
.card{box-shadow:0 1px 2px rgba(16,42,77,.04)}
.bot{display:flex;gap:14px;align-items:center;border:1px solid #cfe0f1;border-radius:16px;padding:10px 16px 10px 10px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(rgba(103,191,237,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(103,191,237,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(135deg,#ffffff,#eef6fd)}
.bot .rbw{position:relative;flex-shrink:0;width:80px;height:84px}
.bot .rb{width:80px;height:84px;display:block;animation:rbFloat 3.6s ease-in-out infinite}
.bot .gear{position:absolute;right:-6px;bottom:2px;width:24px;height:24px;animation:spin 3s linear infinite}
.bubble{position:relative;background:#154378;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.45;max-width:760px;box-shadow:0 4px 14px rgba(21,67,120,.18)}
.bubble:before{content:'';position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:#154378}
.bubble b{color:#bfe5fb}.bubble .t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#9fd3f2;font-weight:600;display:block;margin-bottom:2px}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.dots i{width:5px;height:5px;border-radius:50%;background:#9fd3f2;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.bot .chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:flex;align-items:flex-start;margin:12px 0 2px;padding:0 4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:12px;color:var(--muted);font-weight:500;text-align:center;min-width:0}
.st:before{content:'';position:absolute;top:14px;left:-50%;right:50%;height:3px;background:#d6e0ea;z-index:0}.st:first-child:before{display:none}
.st.done:before,.st.cur:before{background:#7CA22B}
.st.cur:before{background:repeating-linear-gradient(90deg,#7CA22B 0 8px,#bcd98a 8px 16px);background-size:32px 3px;animation:flow 1s linear infinite}
.st .c{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #d6e0ea;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:13px;margin-bottom:5px;color:#8a99a8;font-weight:700}
.st.done .c{background:#7CA22B;border-color:#7CA22B;color:#fff}.st.done{color:#2f4a12}
.st.cur .c{border-color:#154378;color:#154378;box-shadow:0 0 0 0 rgba(21,67,120,.45);animation:pulse 1.8s infinite}.st.cur{color:#154378;font-weight:700}
.st.warn .c{border-color:#c0392b;color:#c0392b}
.status{border-radius:16px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes rbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes flow{to{background-position:32px 0}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,67,120,.45)}70%{box-shadow:0 0 0 10px rgba(21,67,120,0)}100%{box-shadow:0 0 0 0 rgba(21,67,120,0)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-18deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-12deg)}}
.rb .arm-w{transform-origin:96px 92px;animation:wave 3.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bot .rb,.bot .gear,.dots i,.st.cur:before,.st.cur .c,.rb .arm-w{animation:none}}
@media (max-width:860px){.bot{padding:8px 10px 8px 6px;gap:10px}.bot .rbw,.bot .rb{width:52px;height:56px}.bubble{font-size:13px;padding:8px 11px}.bot .chips{display:none}.st{font-size:10px}.st .c{width:24px;height:24px;font-size:11px}.st:before{top:11px}}
</style>

<script>
'use strict';
/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o??null));
const fmt=n=>{if(n===''||n==null||isNaN(Number(n)))return '';return String(Math.round(Number(n)*1000)/1000)};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?NaN:n};
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const nowISO=()=>new Date().toISOString();
const dmy=d=>{d=new Date(d);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
const fdt=d=>{if(!d)return '';d=new Date(d);if(isNaN(d))return '';return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v};
let toastT;function toast(m,cls=''){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.className='toast '+cls;t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3500)}

/* ============ Constantes de negocio ============ */
const ESTADOS=['Borrador','Enviada','Observada','Validada','Exportada','Reservada','Atendida','Anulada'];
const PERMS={ver_todas:'Ver todas las solicitudes',crear:'Crear solicitudes',validar:'Revisar, validar y observar',exportar:'Generar Excel de carga',reserva:'Registrar reservas',editar_mat:'Editar materiales',editar_emb:'Editar embarcaciones y contactos',formulas:'Editar fórmulas',usuarios:'Gestionar usuarios, roles y periodos',eliminar:'Eliminar datos'};
const DEF_ROLES=[
  {id:'admin',nombre:'Administrador',permisos:Object.keys(PERMS)},
  {id:'planificador',nombre:'Planificador',permisos:['ver_todas','crear','validar','exportar','reserva','editar_mat','editar_emb','formulas']},
  {id:'solicitante',nombre:'Solicitante (proveedor)',permisos:['crear']},
  {id:'consulta',nombre:'Consulta',permisos:['ver_todas']}];
const DEF_CARGOS=['Encargado de diseño','Supervisor de proyectos','Inspector de proyectos','Jefe de flota','Almacén'];

/* ============ Evaluador de fórmulas (sin eval) ============ */
function evalFormula(src,vars){
  const s=String(src||'').replace(/\s+/g,'');
  const toks=s.match(/\d+(?:\.\d+)?(?:e[+-]?\d+)?|[A-Za-z_]\w*|[-+*/^(),]/gi)||[];
  if(toks.join('')!==s)throw new Error('Carácter no permitido en la fórmula');
  let i=0;const peek=()=>toks[i],eat=t=>{if(toks[i]!==t)throw new Error('Se esperaba "'+t+'"');i++};
  const F={ceil:Math.ceil,floor:Math.floor,sqrt:Math.sqrt,abs:Math.abs,min:Math.min,max:Math.max,round:(x,d=0)=>Math.round(x*10**d)/10**d};
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=toks[i++];const r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(peek()==='*'||peek()==='/'){const o=toks[i++];const r=pow();v=o==='*'?v*r:v/r}return v}
  function pow(){const b=unary();if(peek()==='^'){i++;return b**pow()}return b}
  function unary(){if(peek()==='-'){i++;return -unary()}if(peek()==='+'){i++;return unary()}return prim()}
  function prim(){const t=toks[i++];if(t==null)throw new Error('Fórmula incompleta');
    if(/^\d/.test(t))return parseFloat(t);
    if(t==='('){const v=expr();eat(')');return v}
    if(/^[A-Za-z_]/.test(t)){
      if(peek()==='('){const f=F[t.toLowerCase()];if(!f)throw new Error('Función desconocida: '+t);i++;const args=[];if(peek()!==')'){args.push(expr());while(peek()===','){i++;args.push(expr())}}eat(')');return f(...args)}
      if(t==='PI')return Math.PI;
      if(!(t in vars))throw new Error('Variable desconocida: '+t);
      const v=Number(vars[t]);if(isNaN(v))throw new Error('Falta valor para '+t);return v}
    throw new Error('Símbolo inesperado: '+t)}
  const v=expr();if(i<toks.length)throw new Error('Sobra "'+toks[i]+'"');if(!isFinite(v))throw new Error('Resultado no válido');return v}
const parseConsts=t=>{const o={};String(t||'').split(/[;\n]/).forEach(p=>{const m=p.match(/^\s*([A-Za-z_]\w*)\s*=\s*(-?[\d.,]+)\s*$/);if(m)o[m[1]]=num(m[2])});return o};
const constsTxt=o=>Object.entries(o||{}).map(([k,v])=>k+'='+v).join('; ');

/* Advertencias de unidades: detecta metros vs milímetros */
function dimWarn(k,val,unit,calc){const v=num(val);if(!v)return '';
  if(unit==='m'&&v>=20)return `${v} m es demasiado grande — ¿quiso decir ${v} mm?`;
  if(unit==='mm'&&v<10)return `${v} mm es demasiado pequeño — ¿quiso decir ${v} m?`;
  const m=unit==='mm'?v/1000:unit==='cm'?v/100:v;const c=(calc&&calc.consts)||{};
  if(k==='L'&&c.PL&&m>c.PL*1.001)return `El largo (${fmt(m)} m) excede la plancha (${c.PL} m)`;
  if(k==='A'&&c.PA&&m>c.PA*1.001)return `El ancho (${fmt(m)} m) excede el ancho del material (${c.PA} m)`;
  return ''}
const toM=(v,u)=>{v=num(v);return u==='mm'?v/1000:u==='cm'?v/100:v};
/* Interpreta observaciones tipo "320 x 1500", "0.32x1.5 m", "3 mt" */
function parseObs(obs){const s=String(obs||'').toLowerCase().replace(',','.');
  const u=x=>x?(x.startsWith('mm')?'mm':x.startsWith('cm')?'cm':'m'):null;
  let m=s.match(/(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)?\s*[x×*]\s*(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)?/);
  if(m){const ug=u(m[4])||u(m[2]);const a=+m[1],b=+m[3];
    const ua=ug||(a>=10?'mm':'m'),ub=ug||(b>=10?'mm':'m');
    const notes=[];let A1=ua,B1=ub;if(ua==='m'&&a>=20){A1='mm';notes.push(`${a} m interpretado como mm`)}if(ub==='m'&&b>=20){B1='mm';notes.push(`${b} m interpretado como mm`)}
    return {tipo:'area',L:toM(a,A1),A:toM(b,B1),raw:m[0],notes}}
  m=s.match(/(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)\b/);
  if(m){let un=u(m[2]);const v=+m[1];const notes=[];if(un==='m'&&v>=50){un='mm';notes.push(`${v} m interpretado como mm`)}return {tipo:'lineal',L:toM(v,un),raw:m[0],notes}}
  return null}

async function hashPw(pw,salt){const enc=new TextEncoder();
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador no permite cifrado seguro');
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s};

function memDB(){const store=new Map(),subs=new Set();let t=0;
  const notify=()=>{clearTimeout(t);t=setTimeout(()=>subs.forEach(f=>f()),0)};
  const snap=(p,v)=>({id:p.slice(p.lastIndexOf('/')+1),exists:v!==undefined,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
  const docRef=path=>({id:path.slice(path.lastIndexOf('/')+1),path,
    get:async()=>snap(path,store.get(path)),
    set:async d=>{store.set(path,clone(d));notify()},
    update:async d=>{store.set(path,{...store.get(path),...clone(d)});notify()},
    delete:async()=>{store.delete(path);notify()},
    onSnapshot(cb){const f=()=>cb(snap(path,store.get(path)));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  return {doc:docRef,collection:col=>({path:col,doc:id=>docRef(col+'/'+(id||rid())),
    onSnapshot(cb){const f=()=>{const docs=[...store.entries()].filter(([p])=>p.slice(0,p.lastIndexOf('/'))===col).map(([p,v])=>snap(p,v));cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}})}}
const wq={};
function W(path,fn){S.pend=(S.pend||0)+1;const t0=Date.now();const tw=setTimeout(()=>{S.lento=true;schedule()},8000);const p=(wq[path]||Promise.resolve()).then(fn);p.then(()=>{S.ultSync=new Date()},()=>{}).finally(()=>{clearTimeout(tw);S.pend--;if(!S.pend)S.lento=false;schedule()});wq[path]=p.catch(()=>{});return p.catch(e=>{
  const c=e&&e.code;toast(c==='invalid_argument'||c==='permission-denied'?'Sin permiso para esta acción con su rol.':c==='quota_exceeded'?'Base de datos llena: '+(e.message||''):'No se pudo guardar: '+(e&&(e.message||e.code)||e),'bad');throw e})}
const setDoc=(path,data)=>W(path,()=>S.db.doc(path).set(clone(data)));
const delDoc=path=>W(path,()=>S.db.doc(path).delete());
const newId=col=>S.db.collection(col).doc().id;
async function delMany(paths,prog){let n=0;for(const p of paths){for(let a=0;a<5;a++){try{await S.db.doc(p).delete();break}catch(e){const c=e&&e.code;if((c==='resource_exhausted'||c==='unavailable')&&a<4){await sleep(700*(a+1))}else throw e}}n++;prog&&prog(n);await sleep(35)}return n}

function visibles(conPer=true){let l=S.solicitudes;if(!can('ver_todas')){const e=myEmpresa();l=l.filter(s=>s.createdBy===S.cuenta||(e&&s.empresaId===e))}

function perSel(){const P=periodosList();return `<select style="width:auto" data-b="per" data-rr="1" title="Periodo"><option value="">Todos los periodos</option>${P.map(p=>`<option ${S.per===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('')}${P.length?`<option value="_sin" ${S.per==='_sin'?'selected':''}>Sin periodo</option>`:''}</select>`}
function chipP(e){const c={Activo:'e-Validada','Por cerrar':'e-Exportada',Cerrado:'e-Anulada'}[e]||'';return `<span class="chip ${c}" style="${e==='Cerrado'?'text-decoration:none':''}">${esc(e)}</span>`}
function chip(e){return `<span class="chip e-${esc(e)}">${esc(e)}</span>`}
function resumenReserva(s){const r=[...new Set((s.items||[]).map(i=>i.reserva).filter(Boolean))];return r.join(', ')}

/* ---------- Inicio / Dashboard ---------- */
function vInicio(){
  const L=visibles(),act=L.filter(s=>s.estado!=='Anulada');
  const issuesOf=s=>revisar(s);
  const sinGP=act.filter(s=>['Enviada','Borrador','Observada'].includes(s.estado)&&(!s.header.grafo||!s.header.pos)).length;
  const refsP=S.materiales.filter(m=>m.ref&&m.estadoRef==='pendiente').length;
  const cnt=e=>act.filter(s=>s.estado===e).length;
  const K=[['Por revisar',cnt('Enviada'),'Enviada','var(--info)'],['Sin actividad definida',sinGP,'_sgp','var(--accent)'],['Validadas (por cargar)',cnt('Validada'),'Validada','var(--ok)'],['Cargadas sin reserva',cnt('Exportada'),'Exportada','var(--warn)'],['Con reserva',cnt('Reservada'),'Reservada','#5530a8'],['Referenciales sin código',refsP,'_ref','var(--bad)']];
  const byE=ESTADOS.map(e=>[e,L.filter(s=>s.estado===e).length]);const mx=Math.max(1,...byE.map(x=>x[1]));
  const embs={};S.embarcaciones.forEach(e=>{if(estProy(e)!=='Cerrado'||act.some(s=>norm(s.header.proyecto)===norm(e.nombre)))embs[e.nombre]={n:0,abiertas:0,items:0}});act.forEach(s=>{const k=s.header.proyecto||'(sin embarcación)';embs[k]=embs[k]||{n:0,abiertas:0,items:0};embs[k].n++;embs[k].items+=(s.items||[]).length;if(!['Atendida','Reservada'].includes(s.estado))embs[k].abiertas++});
  const accion=act.filter(s=>{if(can('validar'))return ['Enviada','Validada','Exportada'].includes(s.estado);return ['Borrador','Observada'].includes(s.estado)}).sort((a,b)=>(b.fechaSolicitud||'').localeCompare(a.fechaSolicitud||'')).slice(0,8);
  return `<div class="head"><h1>Tablero</h1>${perSel()}<div class="sp"></div>${can('validar')?'<button class="btn" data-act="importXL">⬆ Importar Excel recibido</button>':''}${can('crear')?'<button class="btn a" data-act="go" data-v="nueva">+ Nueva solicitud</button>':''}</div>
  <div class="kpis">${K.map(([l,n,f,c])=>`<div class="kpi" style="--c:${c}" data-act="kpi" data-f="${f}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
  <div class="grid g2"><div class="card"><h2>Solicitudes por estado</h2><div class="bars">${byE.map(([e,n])=>`<div class="b"><span>${chip(e)}</span><div class="t"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join('')}</div></div>
  <div class="card"><h2>Por embarcación</h2>${Object.keys(embs).length?`<table><thead><tr><th>Embarcación</th><th>Proyecto</th><th>Solic.</th><th>Abiertas</th><th>Ítems</th></tr></thead><tbody>${Object.entries(embs).map(([k,v])=>`<tr class="click" data-act="kpiEmb" data-e="${esc(k)}"><td>${esc(k)}</td><td>${embBy(k)?chipP(estProy(embBy(k))):''}</td><td>${v.n}</td><td>${v.abiertas}</td><td>${v.items}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sin solicitudes todavía.</div>'}</div></div>
  <div class="card"><h2>Requieren acción</h2>${accion.length?tablaSol(accion,issuesOf):'<div class="empty">Nada pendiente. 👍</div>'}</div>`}
function tablaSol(L,issuesOf){return `<div class="scroll"><table class="rs"><thead><tr><th>Fecha</th><th>Periodo</th><th>Embarcación</th><th>Sistema</th><th>Grafo / Pos</th><th>Actividad</th><th>Empresa</th><th>Ítems</th><th>Reserva</th><th>Estado</th><th>Revisión</th></tr></thead><tbody>
  ${L.map(s=>{const is=issuesOf?issuesOf(s):revisar(s);const er=is.filter(i=>i.n==='error').length,av=is.filter(i=>i.n==='aviso').length;const e=empBy(s.empresaId);
  return `<tr class="click" data-act="open" data-id="${esc(s.id)}"><td data-l="Fecha">${esc(fdt(s.fechaSolicitud))}</td><td data-l="Periodo">${esc(solPeriodo(s)||'—')}</td><td data-l="Embarcación"><b>${esc(s.header.proyecto||'—')}</b></td><td data-l="Sistema">${esc(s.header.sistema||'—')}</td><td data-l="Grafo / Pos" class="mono">${esc(s.header.grafo||'—')} / ${esc(s.header.pos||'—')}</td><td data-l="Actividad">${esc((s.header.nombreActividad||(s.header.actividadTentativa?'(tentativa) '+s.header.actividadTentativa:'')||s.header.consideraciones||'').slice(0,60))}</td><td data-l="Empresa">${esc(e?e.nombre:(s.header.empresaTxt||'—'))}</td><td data-l="Ítems">${(s.items||[]).length}</td><td data-l="Reserva" class="mono">${esc(resumenReserva(s)||'—')}</td><td data-l="Estado">${chip(s.estado)}${S.pendIds&&S.pendIds.has(s.id)?' <span class="chip" style="background:#fde6e3;color:#701a10" title="Guardada solo en este equipo; aún no llega al servidor">⏳ sin enviar</span>':''}</td><td data-l="Revisión">${er?`<span class="chip e-Observada">${er} error</span>`:''} ${av?`<span class="chip ref">${av} aviso</span>`:''}${!er&&!av?'<span class="chip e-Validada">OK</span>':''}</td></tr>`}).join('')}</tbody></table></div>`}

/* ---------- Lista ---------- */
function vLista(){const f=S.filt;let L=visibles();
  if(f.estado==='_sgp')L=L.filter(s=>!['Anulada','Atendida'].includes(s.estado)&&(!s.header.grafo||!s.header.pos));else if(f.estado)L=L.filter(s=>s.estado===f.estado);
  if(f.emb)L=L.filter(s=>(s.header.proyecto||'(sin embarcación)')===f.emb);
  if(f.empresa)L=L.filter(s=>s.empresaId===f.empresa);
  if(f.q){const q=norm(f.q);L=L.filter(s=>norm(JSON.stringify([s.header,(s.items||[]).map(i=>[i.codigo,i.desc,i.reserva])])).includes(q))}
  L=[...L].sort((a,b)=>(b.fechaSolicitud||'').localeCompare(a.fechaSolicitud||''));

/* ---------- Revisión automática ---------- */
function revisar(s){const I=[],h=s.header||{};const pre=['Borrador','Observada'].includes(s.estado),L=pre?'aviso':'error',P=pre?'Pendiente para enviar: ':'';
  if(!h.proyecto)I.push({n:L,envio:1,m:P+'falta la embarcación (proyecto).'});
  const emb=h.proyecto&&embBy(h.proyecto);
  if(h.proyecto&&!emb)I.push({n:'aviso',m:`La embarcación "${h.proyecto}" no está registrada.`});
  if(emb&&estProy(emb)==='Cerrado'&&!['Atendida','Anulada','Reservada'].includes(s.estado))I.push({n:'error',m:`El proyecto ${emb.nombre} está CERRADO: no se reciben solicitudes ni reservas.`});
  else if(emb&&estProy(emb)==='Por cerrar')I.push({n:'aviso',m:`El proyecto ${emb.nombre} está por cerrar.`});
  if(!h.sistema)I.push({n:L,envio:1,m:P+'falta el sistema.'});
  const sis=emb&&(emb.sistemas||[]).find(x=>norm(x.nombre)===norm(h.sistema));
  if(emb&&h.sistema&&!sis)I.push({n:'aviso',m:`El sistema "${h.sistema}" no existe en ${emb.nombre}.`});
  if(!h.grafo)I.push({n:L,envio:1,m:P+'falta el grafo.',fix:sis&&sis.grafo?{k:'setGrafo',v:sis.grafo,l:'Usar '+sis.grafo}:null});
  else if(sis&&sis.grafo&&String(sis.grafo)!==String(h.grafo))I.push({n:'aviso',m:`El grafo ${h.grafo} no coincide con el del sistema (${sis.grafo}).`,fix:{k:'setGrafo',v:sis.grafo,l:'Usar '+sis.grafo}});
  if(!h.pos){let sug=null;if(sis&&h.nombreActividad){sug=bestAct(sis,h.nombreActividad+' '+(h.consideraciones||''))}
    I.push({n:L,envio:1,m:P+'falta la Pos. (actividad)'+(h.actividadTentativa?` — tentativa: "${h.actividadTentativa}"`:'')+'.',fix:sug?{k:'setPos',v:sug.pos,l:`Usar Pos ${sug.pos} — ${sug.nombre}`}:null})}
  if(!(s.items||[]).length)I.push({n:'error',m:'La solicitud no tiene materiales.'});
  (s.items||[]).forEach((it,i)=>{const tag=`Ítem ${i+1} (${it.codigo||'REF'} ${String(it.desc||'').slice(0,28)})`;
    if(!it.codigo){I.push({n:'error',m:`${tag}: material referencial sin código SAP.`,fix:can('editar_mat')?{k:'asignarRef',i,l:'Asignar código'}:null});}
    const m=matBy(it.codigo);
    if(it.codigo&&!m)I.push({n:'aviso',m:`${tag}: el código no está en el catálogo.`,fix:can('editar_mat')?{k:'addMat',i,l:'Agregar al catálogo'}:null});
    if(m&&m.um&&it.um&&m.um!==it.um)I.push({n:'aviso',m:`${tag}: UM "${it.um}" distinta al catálogo (${m.um}).`,fix:{k:'setUm',i,v:m.um,l:'Usar '+m.um}});
    const q=num(it.cantidad);
    if(!(q>0))I.push({n:'error',m:`${tag}: cantidad vacía o no válida.`});
    else if(UM_ENTERA.includes(it.um)&&q%1!==0&&!(m&&m.calc))I.push({n:'aviso',m:`${tag}: cantidad decimal (${it.cantidad}) en unidad entera ${it.um}.`});
    if(m&&m.calc&&it.obs&&!it.calc){const p=parseObs(it.obs);if(p){try{const vars={...m.calc.consts,L:p.L,A:p.A??0,D:p.L,N:1};const r=Math.round(evalFormula(m.calc.formula,vars)*1000)/1000;
      if(q>0&&Math.abs(r-q)/Math.max(r,1e-9)>0.03)I.push({n:'aviso',m:`${tag}: según "${p.raw}" corresponde ${fmt(r)} ${m.um}, se pidió ${it.cantidad}.${p.notes.length?' ('+p.notes.join('; ')+')':''}`,fix:{k:'setCant',i,v:fmt(r),l:'Aplicar '+fmt(r)}});
      else if(p.notes.length)I.push({n:'aviso',m:`${tag}: ${p.notes.join('; ')}.`});}catch(e){}}}
    if(it.calc&&it.calc.warn)I.push({n:'aviso',m:`${tag}: ${it.calc.warn}`});
  });
  return I}
function bestAct(sis,txt){const tk=new Set(norm2(txt));let best=null,bs=0;(sis.actividades||[]).forEach(a=>{const sc=norm2(a.nombre).filter(w=>tk.has(w)).length;if(sc>bs){bs=sc;best=a}});return bs>=2?best:((sis.actividades||[]).length===1?sis.actividades[0]:null)}
function norm2(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2)}

/* ---------- Búsqueda con comodines: pl*12*  ·  tub* 1/2*  ·  perno inox 5/8 ---------- */
const low=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let _ix=null,_ixSrc=null;
function matIndex(){if(_ixSrc!==S.materiales){_ixSrc=S.materiales;_ix=S.materiales.map(m=>({m,t:low(m.codigo+' '+m.desc+' '+(m.cat||'')),d:low(m.desc),c:String(m.codigo)}))}return _ix}
function matcher(q){const terms=low(q).trim().split(/\s+/).filter(Boolean);if(!terms.length)return null;
  const res=terms.map(t=>t.includes('*')?new RegExp(t.split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')):null);
  return txt=>terms.every((t,i)=>res[i]?res[i].test(txt):txt.includes(t))}
function buscarMat(q,{refs=false,max=40}={}){const f=matcher(q);if(!f)return [];const t0=low(q).trim().split(/\s+/)[0].replace(/\*.*/,'');
  const out=[];for(const x of matIndex()){if(!refs&&x.m.ref)continue;if(f(x.t))out.push(x)}
  out.sort((a,b)=>(b.c===q.trim())-(a.c===q.trim())||(b.d.startsWith(t0))-(a.d.startsWith(t0))||a.d.localeCompare(b.d));
  return {total:out.length,list:out.slice(0,max).map(x=>x.m)}}

  L.sort((a,b)=>String(a.desc).localeCompare(String(b.desc)));const show=L.slice(0,300);
  return `<div class="head"><h1>Materiales</h1><span class="muted">${S.materiales.filter(m=>!m.ref).length} en catálogo</span><div class="sp"></div>

   <div class="tabs"><button class="${S.matTab==='cat'?'on':''}" data-act="matTab" data-t="cat">Catálogo</button><button class="${S.matTab==='ref'?'on':''}" data-act="matTab" data-t="ref">Referenciales pendientes (${refs.length})</button></div>
   ${S.matTab==='cat'?`<div class="card"><input data-b="matQ" data-rr="1" placeholder="Buscar: código, descripción o comodines (ej. pl*12*  ·  tub* 1/2*)" value="${esc(S.matQ)}" style="margin-bottom:10px">
   ${show.length?`<div class="scroll"><table class="rs"><thead><tr><th>Código</th><th>Descripción</th><th>UM</th><th>Categoría</th><th>Cálculo</th><th></th></tr></thead><tbody>${show.map(m=>`<tr><td data-l="Código" class="mono">${esc(m.codigo)}</td><td data-l="Descripción">${esc(m.desc)}</td><td data-l="UM">${esc(m.um)}</td><td data-l="Categoría">${esc(m.cat||'')}</td><td data-l="Cálculo">${m.calc?`<span class="formula">${esc(m.calc.formula)}</span>`:'<span class="muted">—</span>'}</td><td>${ed?`<button class="btn s" data-act="matModal" data-id="${esc(m.id)}">Editar</button>`:''}</td></tr>`).join('')}</tbody></table></div>${L.length>300?`<div class="muted small">Mostrando 300 de ${L.length}. Refine la búsqueda.</div>`:''}`:'<div class="empty">Sin materiales. '+(ed?'Importe su catálogo desde Excel (columnas Código, Texto breve de material, Un. medida).':'')+'</div>'}</div>`:
   `<div class="card">${refs.length?`<table class="rs"><thead><tr><th>Foto</th><th>Descripción</th><th>UM</th><th>Especificación</th><th>Solicitado</th><th></th></tr></thead><tbody>${refs.map(m=>`<tr><td data-l="Foto">${m.fotoId?`<button class="btn s" data-act="verFoto" data-id="${esc(m.fotoId)}">📷 Ver</button>`:'—'}</td><td data-l="Descripción"><b>${esc(m.desc)}</b></td><td data-l="UM">${esc(m.um)}</td><td data-l="Especificación">${esc(m.espec||'')}</td><td data-l="Solicitado">${esc(fdt(m.fecha))}</td><td>${ed?`<button class="btn s p" data-act="asignarRefMat" data-id="${esc(m.id)}">Asignar código SAP</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No hay materiales referenciales pendientes.</div>'}</div>`}`}

/* ---------- Embarcaciones ---------- */
function vEmb(){const ed=can('editar_emb');const f=S.embF||'';
  const L=S.embarcaciones.filter(e=>!f||estProy(e)===f).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));

  <p class="muted small" style="margin-top:-6px">Cada embarcación tiene sistemas (con su grafo), actividades (Pos.), contactos que reciben los correos y un estado de proyecto. Un proyecto <b>Cerrado</b> ya no recibe solicitudes ni reservas.</p>
  ${L.length?L.map(e=>`<div class="card"><div class="row"><h2 style="margin:0">${esc(e.nombre)}</h2>${chipP(estProy(e))}<span class="muted small">${(e.sistemas||[]).length} sistema(s) · ${(e.contactos||[]).length} contacto(s)</span><div style="flex:1"></div>
   ${ed?`<select style="width:auto" data-ch="embEstado" data-id="${esc(e.id)}">${EST_PROY.map(x=>`<option ${estProy(e)===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn s" data-act="embModal" data-id="${esc(e.id)}">Editar</button>`:''}</div>
   <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr);margin-top:8px"><div class="scroll"><table class="rs"><thead><tr><th>Sistema</th><th>Grafo</th><th>Actividades (Pos. — nombre)</th></tr></thead><tbody>${(e.sistemas||[]).map(s=>`<tr><td data-l="Sistema"><b>${esc(s.nombre)}</b></td><td data-l="Grafo" class="mono">${esc(s.grafo)}</td><td data-l="Actividades">${(s.actividades||[]).map(a=>`<div><span class="mono">${esc(a.pos)}</span> — ${esc(a.nombre)}</div>`).join('')||'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin sistemas</td></tr>'}</tbody></table></div>
   <div><div class="small" style="font-weight:600;color:var(--muted);margin-bottom:4px">CONTACTOS / CORREOS <span style="font-weight:400">(🔔 recibe alertas)</span></div>${(e.contactos||[]).map(c=>`<div class="small" style="padding:3px 0">${esAlerta(c)?'🔔 ':''}<b>${esc(c.cargo)}</b>${c.nombre?' — '+esc(c.nombre):''}<br><span class="mono">${esc(c.correo)}</span></div>`).join('')||'<span class="muted small">Sin contactos</span>'}</div></div></div>`).join(''):'<div class="card empty">No hay embarcaciones con este filtro.</div>'}`}

/* ---------- Gestión ---------- */
function vGestion(){const adm=can('usuarios'),T=[['cuenta','Mi cuenta']];
  if(adm)T.push(['usuarios','Usuarios'],['empresas','Empresas'],['roles','Roles'],['periodos','Periodos'],['cargos','Cargos']);
  if(can('validar'))T.push(['alertas','Alertas'+(S.notifs.filter(n=>n.estado!=='enviada').length?' ('+S.notifs.filter(n=>n.estado!=='enviada').length+')':'')]);
  if(can('eliminar'))T.push(['datos','Eliminar datos']);
  if(!T.some(t=>t[0]===S.gTab))S.gTab='cuenta';
  const body={cuenta:gCuenta,usuarios:gUsuarios,alertas:gAlertas,empresas:gEmpresas,roles:gRoles,periodos:gPeriodos,cargos:gCargos,datos:gDatos}[S.gTab]();
  return `<div class="head"><h1>Gestión</h1></div><div class="tabs" style="overflow-x:auto">${T.map(([k,l])=>`<button class="${S.gTab===k?'on':''}" data-act="gTab" data-t="${k}">${l}</button>`).join('')}</div>${body}`}
const soloProp=()=>S.owner?'':'<div class="warn" style="margin-bottom:10px">Solo la propietaria del enlace puede guardar cambios en usuarios y roles.</div>';
function gCuenta(){const c=miCuenta()||{},cr=S.creds[c.id]||{};const M=S.mc||(S.mc={a:'',n:'',r:'',c1:cr.correo1||'',c2:cr.correo2||'',c3:cr.correo3||''});
  if(c.id==='__owner__')return '<div class="card">Acceso de recuperación: cree su usuario en la pestaña Usuarios.</div>';
  return `<div class="grid g2"><div class="card"><h2>Mis datos</h2><div class="small"><b>Usuario:</b> <span class="mono">${esc(c.id)}</span><br><b>Nombre:</b> ${esc(c.nombre)}<br><b>Rol:</b> ${esc(rolNombre(c.rol))}<br><b>Empresa:</b> ${esc((empBy(c.empresaId)||{}).nombre||'—')}</div>
   <h2 style="margin-top:16px">Correos de envío</h2><p class="small muted" style="margin-top:-6px">Se usan como Correo 1, 2 y 3 en el Excel de carga de sus solicitudes.</p>
   <div class="grid">${[1,2,3].map(n=>`<div><label>Correo ${n}</label><input type="email" data-b="mc.c${n}" value="${esc(M['c'+n])}"></div>`).join('')}<button class="btn p" data-act="guardarCorreos">Guardar correos</button></div></div>
  <div class="card"><h2>Cambiar contraseña</h2><div class="grid"><div><label>Contraseña actual</label><input type="password" data-b="mc.a" value="${esc(M.a)}"></div><div><label>Nueva contraseña (mín. 6)</label><input type="password" data-b="mc.n" value="${esc(M.n)}"></div><div><label>Repetir nueva contraseña</label><input type="password" data-b="mc.r" value="${esc(M.r)}"></div>
   <button class="btn p" data-act="cambiarPw">Cambiar contraseña</button><p class="small muted">El administrador puede ver su contraseña para ayudarle si la olvida. Use una contraseña que no use en otros servicios.</p></div></div></div>`}
function gUsuarios(){const L=S.cuentas.slice().sort((a,b)=>a.id.localeCompare(b.id));
  return `${soloProp()}<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Usuarios (${L.length})</h2><div style="flex:1"></div><button class="btn a" data-act="userModal">+ Nuevo usuario</button></div>
  ${L.length?`<div class="scroll"><table class="rs"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Empresa</th><th>Contraseña</th><th>Correos</th><th>Último ingreso</th><th>Estado</th><th></th></tr></thead><tbody>${L.map(c=>{const k=S.owner?claveDe(c.id):null,cr=S.creds[c.id]||{},show=S.verPw&&S.verPw[c.id];
   return `<tr><td data-l="Usuario" class="mono"><b>${esc(c.id)}</b>${c.id===S.cuenta?' <span class="chip">tú</span>':''}</td><td data-l="Nombre">${esc(c.nombre)}</td><td data-l="Rol">${esc(rolNombre(c.rol))}</td><td data-l="Empresa">${esc((empBy(c.empresaId)||{}).nombre||'—')}</td>
   <td data-l="Contraseña">${S.owner?(k?`<span class="mono">${show?esc(k.clave):'••••••••'}</span> <button class="btn s" data-act="verPw" data-id="${esc(c.id)}">${show?'Ocultar':'Ver'}</button>${show?`<div class="small muted">${k.por==='usuario'?'Cambiada por el usuario':'Asignada'} ${esc(fdt(k.t))}</div>`:''}`:'<span class="muted small">—</span>'):'<span class="muted small">Solo propietaria</span>'}</td>
   <td data-l="Correos" class="small">${[cr.correo1,cr.correo2,cr.correo3].filter(Boolean).map(esc).join('<br>')||'—'}</td>
   <td data-l="Último ingreso" class="small">${esc(fdt(ultimoIngreso(c.id))||'—')}</td><td data-l="Estado">${c.activo===false?'<span class="chip e-Anulada">Inactivo</span>':'<span class="chip e-Validada">Activo</span>'}</td>
   <td><button class="btn s" data-act="userModal" data-id="${esc(c.id)}">Editar</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay usuarios.</div>'}
  <p class="small muted" style="margin-top:10px">Comparta el enlace de la app con cada persona y entréguele su usuario y contraseña. Al abrir el enlace se le pedirá ingresar con ellos.</p></div>`}
function gAlertas(){const L=S.notifs.slice().sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));
  return `<div class="card"><h2>Alertas de nuevas solicitudes</h2><p class="small muted" style="margin-top:-6px">Se generan al enviar una solicitud (o al importar un Excel recibido) para los contactos marcados con 🔔 de cada embarcación.</p>
  ${L.length?`<table class="rs"><thead><tr><th>Fecha</th><th>Embarcación</th><th>Para</th><th>Asunto</th><th>Estado</th><th></th></tr></thead><tbody>${L.map(n=>`<tr><td data-l="Fecha">${esc(fdt(n.creado))}</td><td data-l="Embarcación">${esc(n.embarcacion)}</td><td data-l="Para" class="small mono">${(n.para||[]).map(esc).join('<br>')}</td><td data-l="Asunto" class="small">${esc(n.asunto)}</td><td data-l="Estado">${n.estado==='enviada'?'<span class="chip e-Validada">Enviada</span>':'<span class="chip e-Exportada">Pendiente</span>'}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn s" data-act="verAlerta" data-id="${esc(n.id)}">Ver / enviar</button>${S.solicitudes.some(x=>x.id===n.solicitudId)?`<button class="btn s" data-act="open" data-id="${esc(n.solicitudId)}">Solicitud</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aún no hay alertas.</div>'}</div>`}
function gEmpresas(){return `<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Empresas proveedoras</h2><div style="flex:1"></div><button class="btn s a" data-act="empModal">+ Empresa</button></div>
   ${S.empresas.length?`<table class="rs"><thead><tr><th>Empresa</th><th>Correos (por defecto)</th><th>Usuarios</th><th></th></tr></thead><tbody>${S.empresas.map(e=>`<tr><td data-l="Empresa"><b>${esc(e.nombre)}</b></td><td data-l="Correos" class="small">${[e.correo1,e.correo2,e.correo3].filter(Boolean).map(esc).join('<br>')||'—'}</td><td data-l="Usuarios">${S.cuentas.filter(c=>c.empresaId===e.id).map(c=>esc(c.id)).join(', ')||'—'}</td><td><button class="btn s" data-act="empModal" data-id="${esc(e.id)}">Editar</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sin empresas.</div>'}
   <p class="small muted">Los correos de la empresa se usan solo si el usuario que creó la solicitud no registró los suyos.</p></div>`}
function gRoles(){const R=S.rolesEd||(S.rolesEd=clone(rolesList()));
  return `${soloProp()}<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Roles y permisos</h2><div style="flex:1"></div><button class="btn s" data-act="rolAdd">+ Rol</button><button class="btn s p" data-act="rolesOK">Guardar roles</button></div>
  <div class="scroll"><table><thead><tr><th>Rol</th>${Object.values(PERMS).map(p=>`<th style="white-space:normal;min-width:80px">${esc(p)}</th>`).join('')}<th></th></tr></thead><tbody>
  ${R.map((r,i)=>`<tr><td><input data-b="rolesEd.${i}.nombre" value="${esc(r.nombre)}" style="min-width:150px"><div class="small muted mono">${esc(r.id)} · ${S.cuentas.filter(c=>c.rol===r.id).length} usuario(s)</div></td>${Object.keys(PERMS).map(p=>`<td style="text-align:center"><input type="checkbox" style="width:auto" data-ch="rolPerm" data-i="${i}" data-p="${p}" ${(r.permisos||[]).includes(p)?'checked':''} ${r.id==='admin'?'disabled':''}></td>`).join('')}<td>${r.id!=='admin'?`<button class="btn s d" data-act="rolDel" data-i="${i}">✕</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">El rol Administrador siempre tiene todos los permisos.</p></div>`}
function gPeriodos(){const P=S.perEd||(S.perEd=clone(periodosList()));
  return `<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Periodos</h2><div style="flex:1"></div><button class="btn s" data-act="perAddAnio">+ Año (I y II)</button><button class="btn s" data-act="perAdd">+ Periodo</button><button class="btn s p" data-act="perOK">Guardar periodos</button></div>
  <p class="small muted" style="margin-top:-4px">Cada solicitud toma el periodo que contiene su fecha de solicitud (o el que el planificador le asigne). Luego puede filtrar por periodo en el Tablero y en Solicitudes.</p>
  ${P.length?`<table class="rs"><thead><tr><th>Nombre</th><th>Desde</th><th>Hasta</th><th>Solicitudes</th><th></th></tr></thead><tbody>${P.map((p,i)=>`<tr><td data-l="Nombre"><input data-b="perEd.${i}.nombre" value="${esc(p.nombre)}" placeholder="2027 - I"></td><td data-l="Desde"><input type="date" data-b="perEd.${i}.inicio" value="${esc(p.inicio)}"></td><td data-l="Hasta"><input type="date" data-b="perEd.${i}.fin" value="${esc(p.fin)}"></td><td data-l="Solicitudes">${S.solicitudes.filter(s=>solPeriodo(s)===p.nombre).length}</td><td><button class="btn s d" data-act="perDel" data-i="${i}">✕</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sin periodos. Use “+ Año (I y II)” para crear, por ejemplo, 2027 - I (ene–jun) y 2027 - II (jul–dic).</div>'}</div>`}
function gCargos(){const C=S.carEd||(S.carEd=clone(cargosList()));
  return `<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Cargos de contacto por embarcación</h2><div style="flex:1"></div><button class="btn s" data-act="carAdd">+ Cargo</button><button class="btn s p" data-act="carOK">Guardar cargos</button></div>
  <p class="small muted" style="margin-top:-4px">Estos cargos se eligen al registrar los contactos (correos) de cada embarcación en la sección Embarcaciones.</p>
  ${C.map((c,i)=>`<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input data-b="carEd.${i}" value="${esc(c)}"><button class="btn s d" data-act="carDel" data-i="${i}">✕</button></div>`).join('')}</div>`}
function datosSel(){const d=S.del||(S.del={per:'',emb:'',estado:'',txt:''});let L=S.solicitudes;
  if(d.per)L=L.filter(s=>d.per==='_sin'?!solPeriodo(s):solPeriodo(s)===d.per);if(d.emb)L=L.filter(s=>norm(s.header.proyecto)===norm(d.emb));if(d.estado)L=L.filter(s=>s.estado===d.estado);return L}
function gDatos(){const d=S.del||(S.del={per:'',emb:'',estado:'',txt:''});const L=datosSel();const nRef=S.materiales.filter(m=>m.ref).length,nMat=S.materiales.filter(m=>!m.ref).length;
  return `${S.owner?`<div class="card"><h2>Respaldo completo</h2><p class="small muted" style="margin-top:-6px">Descarga toda la información (usuarios con sus contraseñas, catálogo, embarcaciones, solicitudes, plantillas, configuración y fotos) en un archivo JSON. Sirve como copia de seguridad y para pasar los datos a la versión independiente de la app. Guárdelo en un lugar seguro: contiene las contraseñas.</p><div class="row"><button class="btn p" data-act="respaldo">⬇ Descargar respaldo (JSON)</button>${S.fb?'<button class="btn" data-act="importarRespaldo">⬆ Importar respaldo (JSON)</button>':''}</div>${S.resProg?`<div class="warn">${esc(S.resProg)}</div>`:''}</div>`:''}<div class="card"><h2>Eliminar solicitudes</h2><p class="small muted" style="margin-top:-6px">Elimina de forma permanente las solicitudes que cumplan los filtros (y sus fotos). No se puede deshacer.</p>
  <div class="grid g3"><div><label>Periodo</label><select data-b="del.per" data-rr="1"><option value="">Todos</option>${periodosList().map(p=>`<option ${d.per===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('')}<option value="_sin" ${d.per==='_sin'?'selected':''}>Sin periodo</option></select></div>
  <div><label>Embarcación</label><select data-b="del.emb" data-rr="1"><option value="">Todas</option>${[...new Set(S.solicitudes.map(s=>s.header.proyecto).filter(Boolean))].map(e=>`<option ${d.emb===e?'selected':''}>${esc(e)}</option>`).join('')}</select></div>
  <div><label>Estado</label><select data-b="del.estado" data-rr="1"><option value="">Todos</option>${ESTADOS.map(e=>`<option ${d.estado===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:12px"><b>${L.length}</b> solicitud(es) seleccionada(s).<div style="flex:1"></div><input style="width:200px" placeholder="Escriba ELIMINAR" data-b="del.txt" data-rr="1" value="${esc(d.txt)}"><button class="btn d" data-act="delSols" ${L.length&&d.txt==='ELIMINAR'?'':'disabled'}>Eliminar ${L.length}</button></div>
  ${S.delProg?`<div class="warn">${esc(S.delProg)}</div>`:''}</div>
  <div class="card"><h2>Catálogo de materiales</h2><div class="row"><span>${nMat} materiales · ${nRef} referenciales</span><div style="flex:1"></div><button class="btn s d" data-act="delMats" data-k="ref" ${nRef?'':'disabled'}>Eliminar referenciales</button><button class="btn s d" data-act="delMats" data-k="all" ${nMat+nRef?'':'disabled'}>Eliminar todo el catálogo</button></div></div>`}

/* ---------- Plantillas de solicitud ---------- */
function plantVis(){return S.plantSol.filter(p=>can('ver_todas')||p.compartida||p.creadoPor===S.cuenta||(p.empresaId&&p.empresaId===myEmpresa())).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)))}
const plantEditable=p=>can('validar')||p.creadoPor===S.cuenta;
function vPlantillas(){const q=norm(S.plQ||'');const L=plantVis().filter(p=>!q||norm(p.nombre+' '+p.nombreActividad+' '+p.proyecto+' '+p.sistema+' '+(p.descripcion||'')).includes(q));
  return `<div class="head"><h1>Plantillas de solicitud</h1><span class="muted">${L.length}</span><div class="sp"></div></div>
  <p class="muted" style="margin-top:-6px">Guarde como plantilla las solicitudes de actividades que se repiten (desde el botón “☆ Guardar como plantilla” de una solicitud). Al usarla se crea un borrador con los mismos materiales y solo ajusta las cantidades.</p>
  <div class="card"><input data-b="plQ" data-rr="1" value="${esc(S.plQ||'')}" placeholder="Buscar plantilla, actividad, embarcación…" style="margin-bottom:10px">
  ${L.length?`<div class="scroll"><table class="rs"><thead><tr><th>Plantilla</th><th>Actividad</th><th>Embarcación / sistema / Pos.</th><th>Materiales</th><th>Creada por</th><th>Visible para</th><th></th></tr></thead><tbody>${L.map(p=>`<tr>
   <td data-l="Plantilla"><b>${esc(p.nombre)}</b>${p.descripcion?`<div class="small muted">${esc(p.descripcion)}</div>`:''}</td><td data-l="Actividad">${esc(p.nombreActividad||'—')}</td>
   <td data-l="Asignación">${p.proyecto?esc(p.proyecto)+(p.sistema?' / '+esc(p.sistema):'')+(p.pos?' / Pos '+esc(p.pos):''):'<span class="muted">Sin asignación</span>'}</td>

function botVista(v){const c=miCuenta()||{},nom=esc(String(c.nombre||'').split(' ')[0]||'');const L=visibles().filter(s=>s.estado!=='Anulada');const n=e=>L.filter(s=>s.estado===e).length;

  if(v==='materiales')return botHTML('Busca rápido con comodines: <b>pl*12*</b>, <b>tub* 1/2*</b>. Si no encuentras un material, regístralo como referencial y el planificador le asigna su código.',{title:'Catálogo'});

const PASOS=[['Borrador','Registro'],['Enviada','Recibida'],['Validada','Validada'],['Exportada','Cargada'],['Reservada','Reservada'],['Atendida','Atendida']];
function estadoPanel(s){const e=s.estado,pl=can('validar');let idx=PASOS.findIndex(p=>p[0]===e);if(e==='Observada')idx=1;
  const res=resumenReserva(s),falta=revisar(s).some(x=>x.envio);let msg='',mood='ok',working=false,title='Estado de tu pedido';
  if(cerrada(s)){msg='El proyecto de esta embarcación está <b>cerrado</b>: la solicitud queda solo para consulta.';mood='worry'}
  else switch(e){
   case 'Borrador':msg=falta?`${S.isNew?'¡Vamos armando tu pedido! ':''}Cuando definas la embarcación y la actividad (Pos.) podrás enviarlo. Mientras tanto lo guardo automáticamente.`:'Todo listo ✔ Presiona <b>Enviar solicitud</b> y yo me encargo de avisar a los encargados.';mood=falta?'ok':'happy';break;
   case 'Enviada':msg=pl?'Pedido recibido. Revisa los materiales y valídalo para preparar la carga.':'<b>¡Recibido! Tu pedido está siendo atendido.</b> El planificador está revisando los materiales.';working=true;break;
   case 'Observada':msg=`Tu pedido tiene observaciones${s.observacion?': <b>'+esc(s.observacion)+'</b>':''}. Corrígelo y vuelve a enviarlo.`;mood='worry';break;
   case 'Validada':msg='Pedido validado ✔ Preparando el archivo para la carga de la reserva…';working=true;break;
   case 'Exportada':msg='Cargando la reserva en el sistema… En cuanto tenga el número de reserva y las posiciones las verás aquí.';working=true;break;
   case 'Reservada':msg=`¡Listo! ${res?'Reserva <b>'+esc(res)+'</b> generada.':'Reserva generada.'} Usa <b>📋 Copiar reserva / pos</b> para pegarla en tu sistema.`;mood='happy';break;
   case 'Atendida':msg='Pedido atendido por completo. ¡Gracias! 🎉';mood='happy';break;
   case 'Anulada':msg='Esta solicitud fue anulada.';mood='worry';break}
  const steps=e==='Anulada'?'':`<div class="steps">${PASOS.map((p,i)=>{const cls=i<idx?'done':i===idx?(e==='Observada'?'cur warn':'cur'):'';return `<div class="st ${cls}"><div class="c">${i<idx?'✓':i===idx&&e==='Observada'?'!':i+1}</div>${i===1&&e==='Observada'?'Observada':p[1]}</div>`}).join('')}</div>`;
  return `<div class="card status" style="padding:12px 14px">${botHTML(msg,{mood,working,title}).replace('class="bot"','class="bot" style="margin:0;border:0;padding:0;background:none"')}${steps}</div>`}

  else if(M.t==='asignar')body=mAsignar(M);else if(M.t==='confirm')body=`<h2>${esc(M.title)}</h2><p>${esc(M.msg)}</p><div class="mfoot"><button class="btn" data-act="closeM">Cancelar</button><button class="btn ${M.danger?'d':'p'}" data-act="confirmOK">${esc(M.ok||'Aceptar')}</button></div>`;

function calcOut(calc,vals){const vars={...calc.consts,N:1};const warns=[];
  for(const k of calc.inputs){const v=vals[k]||{};if(INPUTS[k]&&INPUTS[k].dim){if(v.v===''||v.v==null)return {err:'Ingrese '+INPUTS[k].label.toLowerCase()};vars[k]=toM(v.v,v.u);const w=dimWarn(k,v.v,v.u,calc);if(w)warns.push(w)}else vars[k]=num(v.v)||(k==='N'?1:0)}
  try{const r=evalFormula(calc.formula,vars);return {r:Math.round(r*1000)/1000,warns,vars}}catch(e){return {err:e.message}}}

async function iniciarSesionDemo(u,pw){S.loginErr='';u=String(u||'').trim().toLowerCase();if(!u||!pw){S.loginErr='Ingrese usuario y contraseña.';render();return}
  if(!S.uid){S.loginErr='Debe iniciar sesión en claude.ai para usar la app.';render();return}
  S.loggingIn=u;render();
  try{const c=S.cuentas.find(x=>x.id===u),cr=S.creds[u];await sleep(300);
    if(!c||!cr||!cr.salt||(await hashPw(pw,cr.salt))!==cr.hash){S.loginErr='Usuario o contraseña incorrectos.';return}
    if(c.activo===false){S.loginErr='Este usuario está desactivado. Consulte al administrador.';return}
    await setDoc('sesiones/'+S.uid,{usuario:u,tag:cr.hash.slice(0,16),t:nowISO()});S.sesion={usuario:u,tag:cr.hash.slice(0,16)};S.cuenta=u;S.view='inicio'}
  catch(e){S.loginErr='No se pudo ingresar: '+(e.message||e.code||e)}finally{S.loggingIn=null;afterData();render()}}

function fbAdapter(db){

  const matRef=code=>({id:code,path:'materiales/'+code,
    async set(data){if(data&&data.ref)return db.doc('materiales/'+code).set(data);const d=clone(data);delete d.id;
      const ref=db.doc('catalogo/'+chunkOf(code));try{await ref.update(FP('items',code),d)}catch(e){if(e&&e.code==='not-found')await ref.set({items:{[code]:d}},{merge:true});else throw e}},
    async delete(){const m=S.materiales.find(x=>x.id===code);if(m&&m.ref)return db.doc('materiales/'+code).delete();
      try{await db.doc('catalogo/'+chunkOf(code)).update(FP('items',code),firebase.firestore.FieldValue.delete())}catch(e){if(!(e&&e.code==='not-found'))throw e}},
    get:()=>db.doc('materiales/'+code).get()});
  return {doc:p=>p.startsWith('materiales/')?matRef(p.slice(11)):db.doc(p),collection:p=>db.collection(p),raw:db}}

    try{await u.updatePassword(M.n);await setDoc('claves/'+S.cuenta,{usuario:S.cuenta,clave:M.n,t:nowISO(),por:'usuario'});S.mc=null;render();toast('Contraseña cambiada')}catch(e){toast(errMsg(e),'bad')}},
  userDel(){if(!S.fb)return ACT0.userDel();const v=S.modal.v;S.modal={t:'confirm',title:'Eliminar usuario',msg:`¿Eliminar el usuario ${v.id}? Ya no podrá ingresar. Sus solicitudes se conservan.`,ok:'Eliminar',danger:true,fn:async()=>{
    const k=claveDe(v.id);if(k&&k.clave){try{await conSecundaria(async a=>{const cr=await a.signInWithEmailAndPassword(em(v.id),k.clave);await cr.user.delete()})}catch(e){console.warn(e)}}
    await delDoc('cuentas/'+v.id);await delDoc('claves/'+v.id).catch(()=>{});toast('Usuario eliminado')}};render()},
  async rolesOK(){if(!S.fb)return ACT0.rolesOK();const R=S.rolesEd.map((r,i)=>({id:r.id,nombre:String(r.nombre||'').trim()||r.id,permisos:r.id==='admin'?Object.keys(PERMS):r.permisos,orden:i}));
    try{const db=FB.raw,b=db.batch();R.forEach(r=>b.set(db.doc('rolesCfg/'+r.id),{nombre:r.nombre,permisos:r.permisos,orden:r.orden}));(S.rolesCfg||[]).filter(x=>!R.some(r=>r.id===x.id)).forEach(x=>b.delete(db.doc('rolesCfg/'+x.id)));await b.commit();S.rolesEd=null;render();toast('Roles guardados')}catch(e){toast(errMsg(e),'bad')}},
  async importMat(){if(!S.fb)return ACT0.importMat();const f=await pickFile('.xlsx,.xls,.csv');if(!f)return;let rows;try{rows=await readXL(f)}catch(e){toast(e.message,'bad');return}
    const porChunk={};let n=0;for(const r of rows){const c=String(cell(r.codigo||r.material||r.codigosap)).trim();const d=cell(r.textobrevedematerial||r.descripcion||r.textobreve);if(!/^[A-Za-z0-9_\-.]+$/.test(c)||!d)continue;
      const prev=matBy(c);const um=cell(r.unmedidadeentrada||r.um||r.unidad||r.unmedidabase)||(prev&&prev.um)||'UN';if(prev&&prev.desc===String(d).toUpperCase()&&prev.um===um)continue;
      const k=chunkOf(c);(porChunk[k]=porChunk[k]||{})[c]=clone({codigo:c,desc:String(d).toUpperCase(),um,cat:(prev&&prev.cat)||cell(r.categoria)||'',calc:(prev&&prev.calc)||null,actualizado:nowISO()});n++}
    toast('Importando '+n+' materiales…');try{for(const [k,items] of Object.entries(porChunk))await FB.raw.doc('catalogo/'+k).set({items},{merge:true});toast(`${n} material(es) importados o actualizados`)}catch(e){toast(errMsg(e),'bad')}},
  delMats(el){if(!S.fb)return ACT0.delMats(el);const k=el.dataset.k;const refs=S.materiales.filter(m=>m.ref),todos=S.materiales.length;
    S.modal={t:'confirm',title:k==='all'?'Eliminar todo el catálogo':'Eliminar referenciales',msg:`Se eliminarán ${k==='all'?todos:refs.length} materiales de forma permanente.`,ok:'Eliminar',danger:true,fn:async()=>{
      S.gTab='datos';S.delProg='Eliminando materiales…';render();try{const paths=refs.map(m=>'materiales/'+m.id).concat(refs.filter(m=>m.fotoId).map(m=>'fotos/'+m.fotoId));
        await delMany(paths);if(k==='all')for(let i=0;i<NCH;i++)await FB.raw.doc('catalogo/c'+i).delete();S.delProg='Listo: materiales eliminados.'}catch(e){S.delProg='Se detuvo: '+errMsg(e)}render()}};render()},
  async importarRespaldo(){if(!S.fb||!S.owner)return;const f=await pickFile('.json');if(!f)return;let D;try{D=JSON.parse(await f.text())}catch(e){toast('El archivo no es un respaldo válido.','bad');return}
    if(D.formato!=='pedidos-material-tasa'){toast('El archivo no es un respaldo de esta app.','bad');return}
    S.modal={t:'confirm',title:'Importar respaldo',msg:`Se cargarán ${D.usuarios.length} usuarios, ${D.materiales.length} materiales, ${D.embarcaciones.length} embarcaciones y ${D.solicitudes.length} solicitudes del ${fdt(D.fecha)}. Los datos con el mismo identificador se reemplazan.`,ok:'Importar',fn:()=>importar(D)};render()},
});
async function importar(D){const db=FB.raw;const prog=m=>{S.resProg=m;S.gTab='datos';schedule()};const avisos=[];
  try{
  /* 1. Usuarios (se crean con la misma contraseña) */
  let i=0;for(const u of D.usuarios||[]){i++;prog(`Usuarios ${i}/${D.usuarios.length}…`);if(!okUser(u.usuario))continue;
    if(u.usuario===S.cuenta){continue}
    let pw=u.clave&&u.clave.length>=6?u.clave:'';if(!pw){pw=genPw();avisos.push(`${u.usuario}: nueva contraseña ${pw}`)}
    try{await conSecundaria(async a=>{try{await a.createUserWithEmailAndPassword(em(u.usuario),pw)}catch(e){if(e&&e.code==='auth/email-already-in-use')await a.signInWithEmailAndPassword(em(u.usuario),pw);else throw e}})}
    catch(e){avisos.push(`${u.usuario}: no se pudo crear el acceso (${errMsg(e)})`);continue}
    await db.doc('cuentas/'+u.usuario).set({nombre:u.nombre||u.usuario,rol:u.rol||'solicitante',empresaId:u.empresaId||'',activo:u.activo!==false,correo1:u.correo1||'',correo2:u.correo2||'',correo3:u.correo3||'',creado:nowISO(),actualizado:nowISO(),ultimoIngreso:''});
    await db.doc('claves/'+u.usuario).set({usuario:u.usuario,clave:pw,t:nowISO(),por:'admin'});await sleep(150)}
  /* 2. Roles y configuración */
  prog('Roles y configuración…');{const b=db.batch();(D.roles||[]).forEach((r,k)=>b.set(db.doc('rolesCfg/'+r.id),{nombre:r.nombre,permisos:r.id==='admin'?Object.keys(PERMS):(r.permisos||[]),orden:k}));
    for(const k of ['plantillas','periodos','cargos'])if(D.config&&D.config[k])b.set(db.doc('config/'+k),{list:D.config[k]});await b.commit()}
  /* 3. Catálogo en bloques */
  prog('Catálogo de materiales…');const porChunk={};const refs=[];for(const m of D.materiales||[]){const o=clone(m);const id=o.id;delete o.id;if(o.ref)refs.push([id,o]);else{const c=String(o.codigo||id);(porChunk[chunkOf(c)]=porChunk[chunkOf(c)]||{})[c]=o}}
  for(const [k,items] of Object.entries(porChunk))await db.doc('catalogo/'+k).set({items},{merge:true});
  /* 4. Colecciones */
  const lotes=async(col,list)=>{for(let k=0;k<list.length;k+=400){const b=db.batch();list.slice(k,k+400).forEach(([id,o])=>b.set(db.doc(col+'/'+id),clone(o)));await b.commit();prog(`${col}: ${Math.min(k+400,list.length)}/${list.length}…`)}};
  const pares=l=>(l||[]).map(x=>{const o=clone(x);const id=o.id;delete o.id;return [id,o]});
  await lotes('materiales',refs);await lotes('empresas',pares(D.empresas));await lotes('embarcaciones',pares(D.embarcaciones));
  await lotes('plantillasSol',pares(D.plantillasSol));await lotes('notificaciones',pares(D.notificaciones));await lotes('solicitudes',pares(D.solicitudes));
  /* 5. Fotos */
  const F=Object.entries(D.fotos||{});let n=0;for(const [id,data] of F){await db.doc('fotos/'+id).set({data});n++;prog(`Fotos ${n}/${F.length}…`)}
  prog(`Importación completa.${avisos.length?' Revise: '+avisos.join(' · '):''}`)}
  catch(e){prog('Se detuvo: '+errMsg(e)+(avisos.length?' · '+avisos.join(' · '):''))}
  render()}

async function boot(){const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){if(window.claude&&window.claude.use)return bootClaude();S.demo=true;S.db=memDB();S.uid='demo';S.owner=true;await seedDemo(S.db);S.boot='ok';subscribeDemo();render();return}
  S.fb=true;firebase.initializeApp(cfg);FB.auth=firebase.auth();const fs=firebase.firestore();
  try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){console.warn(e)}
  try{await fs.clearPersistence()}catch(e){}
  window.addEventListener('online',()=>{S.offline=false;schedule()});window.addEventListener('offline',()=>{S.offline=true;schedule()});
  FB.raw=fs;S.db=fbAdapter(fs);
  const sec=firebase.initializeApp(cfg,'secundaria');FB.secAuth=sec.auth();try{await FB.secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
  try{const sn=await fs.doc('config/sistema').get();S.inicializado=sn.exists}catch(e){S.inicializado=true;console.warn(e)}
  S.boot='ok';render();FB.auth.onAuthStateChanged(u=>onAuth(u))}

boot();
</script>
